<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio Modelagem</title>
<style>
body{margin:0;font-family:Arial;background:#fff;text-align:center;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;max-width:900px;margin:20px auto}
.card{border:1px solid #ddd;border-radius:12px;overflow:hidden;cursor:pointer;transition:0.2s}
.card:hover{transform:scale(1.03)}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card p{padding:8px;margin:0;font-weight:bold}
.painel{max-width:600px;margin:30px auto;padding:20px;background:#f5f5f5;border-radius:16px}
.btn{display:inline-block;margin-top:15px;padding:16px 32px;background:#000;color:#fff;border-radius:30px;text-decoration:none;font-weight:bold;font-size:18px}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:10}
#modal img{max-width:90%;max-height:90%;border-radius:10px}
</style>
</head>
<body>
<h1>Minha Coleção - Desafio Modelagem</h1>
<p>Clique nas fotos para ampliar</p>

<div class="grid">
  <div class="card" onclick="abrir('https://picsum.photos/600/600?1')"><img src="https://picsum.photos/300/300?1"><p>Look 1</p></div>
  <div class="card" onclick="abrir('https://picsum.photos/600/600?2')"><img src="https://picsum.photos/300/300?2"><p>Look 2</p></div>
  <div class="card" onclick="abrir('https://picsum.photos/600/600?3')"><img src="https://picsum.photos/300/300?3"><p>Look 3</p></div>
  <div class="card" onclick="abrir('https://picsum.photos/600/600?4')"><img src="https://picsum.photos/300/300?4"><p>Look 4</p></div>
  <div class="card" onclick="abrir('https://picsum.photos/600/600?5')"><img src="https://picsum.photos/300/300?5"><p>Look 5</p></div>
</div>

<div class="painel">
  <h2>Painel da Coleção</h2>
  <p>Coleção inspirada em modelagem moderna - elegante e confortável.</p>
  <a class="btn" href="https://wa.me/5511999999999" target="_blank">🛒 COMPRAR AGORA</a>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="imgGrande"></div>

<script>
function abrir(src){document.getElementById('imgGrande').src=src;document.getElementById('modal').style.display='flex'}
</script>
</body>
</html>
